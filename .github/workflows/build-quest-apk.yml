name: Build Quest 3 APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_VERSION_TAG: "4.3-stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Download Godot headless editor + export templates
        run: |
          mkdir -p /tmp/godot
          cd /tmp/godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION_TAG}_linux.x86_64 godot4
          chmod +x godot4
          echo "GODOT_BIN=/tmp/godot/godot4" >> $GITHUB_ENV

          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION_TAG}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          unzip -q templates.tpz -d /tmp/godot/templates_extracted
          mv /tmp/godot/templates_extracted/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/

      - name: Generate a debug keystore for signing
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Quest3Shooter Debug,O=Dev,C=US"

      - name: Point Godot's editor settings at Android SDK + keystore
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import project resources
        run: |
          "$GODOT_BIN" --headless --path . --import --quit || true

      - name: Export debug APK for Meta Quest 3
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Meta Quest 3" build/quest3-shooter.apk --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest3-shooter-apk
          path: build/quest3-shooter.apk
          if-no-files-found: error
